<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Offline — Growza</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #eef1ef;
    color: #14201b;
    font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    gap: 14px;
  }
  .badge {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(180deg, #16a34a 0%, #15803d 100%);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 26px;
    margin-bottom: 6px;
  }
  h1 { font-size: 19px; margin: 0; }
  p { color: #77857f; margin: 0; max-width: 320px; font-size: 15px; line-height: 1.5; }
  button {
    margin-top: 10px;
    padding: 10px 22px;
    border: none;
    border-radius: 10px;
    background: #16a34a;
    color: #fff;
    font: inherit;
    font-weight: 620;
    cursor: pointer;
  }
  button:hover { background: #15803d; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">G</div>
    <h1>You're offline</h1>
    <p>Growza needs an internet connection to show your business. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
