# Jira GRW-420 — this repository's first CI, and the reason it is public.
#
# The repo was made public so Actions minutes are free; until now it had no
# `.github/` at all, so the saving was theoretical. This is the workflow that
# collects it: the dashboard's typecheck and build move off the private repo's
# metered minutes.
#
# It is also the PROOF for the rest of GRW-420. The .npmrc, the pinned version,
# the flat Dockerfile and the corrected outputFileTracingRoot were all written
# without being able to install anything locally — `@growza-app/shared` lives
# on GitHub Packages and needs a token. This run is what says whether they are
# right.
#
# If "Install" fails with a 401 or 404 on @growza-app/shared, the cause is not
# this file: the package must grant this repository access, under
# Packages → @growza-app/shared → Manage Actions access → add growza-web.
name: CI

# `paths-ignore` is repeated under BOTH triggers, because GitHub applies it per trigger: listing it once under
# `push` would leave every pull_request running the full build for a typo in a comment.
#
# Only files that cannot change what the app does. Not `public/**` — the service worker lives there, and a stale
# one is exactly the bug CACHE_VERSION exists to fix. Not `messages/**` — the tests read those, and a missing key
# renders on screen as its own name (GRW-647 shipped that for half a day).
on:
  push:
    branches: [main, develop]
    paths-ignore: &prose
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    paths-ignore: *prose

# One run per branch, and it is the latest one.
#
# 2026-10-24: 1,020 runs in a month, ~2.1 minutes each — 2,002 minutes, which is most of the account's Actions
# usage. The runs were not slow; there were too many. A feature branch collected seven to sixteen of them, one
# per push, and every run but the last was already answering a commit nobody would merge.
#
# `cancel-in-progress` ends those the moment the next push arrives. It is safe on every branch here because this
# workflow only reads: it typechecks, builds and tests, and deploys nothing. A cancelled run leaves nothing
# half-done. (A deploy workflow would need `cancel-in-progress: false` — stopping a deploy halfway is how a box
# ends up on neither version.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `packages: read` is what lets GITHUB_TOKEN pull @growza-app/shared.
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: this repo has no lockfile yet — it was a workspace member
      # and the lock lived in the monorepo. Commit one generated with the token
      # in place and this becomes `npm ci`, which is what makes it reproducible.
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --no-audit --no-fund

      # `npx tsc` without typescript installed silently fetches an unrelated
      # 2016 package called `tsc` and fails with "This is not the tsc command
      # you are looking for". Run the project's own compiler from node_modules.
      - name: Typecheck
        run: npx --no-install tsc --noEmit

      # The same build the image runs, so a break shows up here rather than in
      # a container that will not start.
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          API_URL: http://api:3001
        run: npm run build

      # These 78 files have never run anywhere: vitest belonged to the monorepo
      # root and did not come across with the split. Free minutes on a public
      # repo is exactly what they were waiting for.
      - name: Tests
        run: npm test
